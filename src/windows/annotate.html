<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ER Timer — Draw on hint</title>
  <link rel="stylesheet" href="../styles/annotate.css">
</head>
<body>

  <div id="toolbar">
    <div class="tb-group" id="tools">
      <button class="tool" data-tool="move" title="Move / edit — drag to reposition, click text to change it (V)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5v19M2.5 12h19M12 2.5 9.3 5.2M12 2.5l2.7 2.7M12 21.5l-2.7-2.7M12 21.5l2.7-2.7M2.5 12l2.7-2.7M2.5 12l2.7 2.7M21.5 12l-2.7-2.7M21.5 12l-2.7 2.7"/>
        </svg>
      </button>

      <span class="tb-sep"></span>

      <button class="tool active" data-tool="pen" title="Freehand (P)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="tool" data-tool="marker" title="Highlighter — see-through, shades an area without hiding it (H)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20.5h16"/><path d="M7.5 16.5l7.5-9 4 3.4-7.5 9h-4z"/></svg>
      </button>

      <span class="tb-sep"></span>

      <button class="tool" data-tool="line" title="Straight line (L)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5 19.5 4.5"/></svg>
      </button>
      <button class="tool" data-tool="arrow" title="Arrow (A)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 19.5 19 5"/><path d="M19.5 12.5V4.5h-8"/></svg>
      </button>
      <button class="tool" data-tool="curve" title="Curved arrow — hold Shift to bend the other way (C)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 20C3.5 11 9.5 5.5 18.5 5.5"/><path d="M14 2 18.8 5.6 15.2 10"/></svg>
      </button>

      <span class="tb-sep"></span>

      <button class="tool" data-tool="rect" title="Box (R)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/></svg>
      </button>
      <button class="tool" data-tool="fillrect" title="Solid box — covers up part of the picture (F)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="Circle (O)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/></svg>
      </button>

      <span class="tb-sep"></span>

      <button class="tool" data-tool="number" title="Numbered marker — click to drop 1, 2, 3… (N)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/><path d="M10.6 9.6 12.7 8.4V16"/></svg>
      </button>
      <button class="tool" data-tool="text" title="Text (T)">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" id="swatches">
      <button class="sw active" data-color="#ff3b30" style="background:#ff3b30"></button>
      <button class="sw" data-color="#ff9500" style="background:#ff9500"></button>
      <button class="sw" data-color="#ffe000" style="background:#ffe000"></button>
      <button class="sw" data-color="#34c759" style="background:#34c759"></button>
      <button class="sw" data-color="#00c8e0" style="background:#00c8e0"></button>
      <button class="sw" data-color="#0a84ff" style="background:#0a84ff"></button>
      <button class="sw" data-color="#ff2d95" style="background:#ff2d95"></button>
      <button class="sw" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="sw" data-color="#000000" style="background:#000000"></button>
      <label id="wheel" title="Pick any colour">
        <input type="color" id="color-input" value="#ff3b30">
      </label>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <span class="tb-label">Size</span>
      <input type="range" id="width-input" min="2" max="24" value="13">
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" id="btn-undo"  title="Undo (Ctrl+Z)">↩ Undo</button>
      <button class="tb-btn" id="btn-clear" title="Remove all drawings">Clear</button>
    </div>
  </div>

  <div id="stage-wrap">
    <div id="stage">
      <div id="frame">
        <img id="base" alt="">
        <canvas id="paint"></canvas>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <span id="hint-note">Preview of the player screen · draw, then send · Move tool: drag to reposition, click text to edit, Delete to remove</span>
    <div class="bb-actions">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-send">Send to players</button>
    </div>
  </div>

  <script src="../renderer/annotate-renderer.js"></script>
</body>
</html>
