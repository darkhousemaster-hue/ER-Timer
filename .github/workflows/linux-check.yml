# Builds and smoke-tests the Linux app on every push to main.
# It never publishes anything — it exists so Linux breakage is caught
# before a release tag is cut, and so the build can be iterated on
# without creating releases. The Windows release workflow is untouched.
name: Linux check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (never publishes)
        run: npx electron-builder --linux --x64 --publish never

      - name: Install a headless desktop to test in
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils xdotool \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2

      - name: Smoke test — does it start and open its windows?
        run: |
          set -e
          APP="dist/linux-unpacked/$(node -p "require('./package.json').name")"
          if [ ! -x "$APP" ]; then
            echo "::error::executable not found at $APP"
            ls -la dist/linux-unpacked | head -30
            exit 1
          fi
          echo "executable: $APP"

          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          sleep 3
          export DISPLAY=:99
          "$APP" --no-sandbox --disable-gpu --disable-dev-shm-usage > /tmp/app.log 2>&1 &
          APP_PID=$!
          sleep 25

          TAIL=$(tail -c 400 /tmp/app.log | tr '\012' ' ')
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::app exited on its own. log: $TAIL"
            cat /tmp/app.log; exit 1
          fi

          echo "--- windows on screen ---"
          xdotool search --name "ER Timer" getwindowname %@ || true
          COUNT=$(xdotool search --name "ER Timer" | wc -l)
          kill "$APP_PID" 2>/dev/null || true

          if [ "$COUNT" -lt 2 ]; then
            echo "::error::expected 2 windows, found $COUNT. log: $TAIL"
            cat /tmp/app.log; exit 1
          fi
          echo "PASS: started with $COUNT windows"

      - name: Artifacts produced
        run: ls -la dist/*.AppImage dist/*.deb dist/latest-linux.yml || true

      - name: App log (always)
        if: always()
        run: cat /tmp/app.log || true
